name: Build

on: push

permissions:
  contents: read

env:
  NODE_VERSION: '26.13.1'

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      release-version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Validate release tag
        id: release
        if: github.ref_type == 'tag'
        run: |
          version=$(node -p 'require("./package.json").version')
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $version"
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm test
      - run: npm run package:plugin
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ github.ref_type == 'tag' && 'dsh-simplify-path' || 'dsh-simplify-path-nightly' }}
          path: artifacts/*.tgz
          if-no-files-found: error

  publish-npm:
    needs: build
    if: needs.build.outputs.release-version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          name: dsh-simplify-path
          path: artifacts
      - run: npm publish "./artifacts/dsh-simplify-path-${RELEASE_VERSION}.tgz" --access public --provenance=false
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.release-version }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    needs: build
    if: needs.build.outputs.release-version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dsh-simplify-path
          path: artifacts
      - run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
            "artifacts/dsh-simplify-path-${RELEASE_VERSION}.tgz"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.build.outputs.release-version }}
